<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes RDV - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #28a745;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .navbar h1 { font-size: 24px; }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #1e7e34;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        table {
            width: 100%;
            background: white;
            border-radius: 10px;
            border-collapse: collapse;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: left;
        }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        .btn-confirmer {
            padding: 6px 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-annuler {
            padding: 6px 12px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .statut-en-attente { color: orange; font-weight: bold; }
        .statut-confirme { color: green; font-weight: bold; }
        .statut-annule { color: red; font-weight: bold; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🏥 Mes Rendez-vous</h1>
    <a th:href="@{/medecin/dashboard}">Retour</a>
</div>
<div class="container">
    <h2 style="margin-bottom:20px">Liste de mes rendez-vous</h2>
    <table>
        <thead>
        <tr>
            <th>Patient</th>
            <th>Date</th>
            <th>Heure</th>
            <th>Statut</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rdv : ${rdvs}">
            <td th:text="${rdv.patient.nom + ' ' + rdv.patient.prenom}"></td>
            <td th:text="${rdv.date}"></td>
            <td th:text="${rdv.heure}"></td>
            <td>
                        <span th:text="${rdv.statut}"
                              th:class="${rdv.statut == 'EN_ATTENTE' ? 'statut-en-attente' :
                                        rdv.statut == 'CONFIRME' ? 'statut-confirme' :
                                        'statut-annule'}"></span>
            </td>
            <td>
                <form th:action="@{/medecin/rdv/confirmer/{id}(id=${rdv.id})}" method="post" style="display:inline">
                    <button class="btn-confirmer">✅ Confirmer</button>
                </form>
                <form th:action="@{/medecin/rdv/annuler/{id}(id=${rdv.id})}" method="post" style="display:inline">
                    <button class="btn-annuler">❌ Annuler</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

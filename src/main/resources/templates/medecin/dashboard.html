<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espace Médecin - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #28a745;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .navbar h1 { font-size: 24px; }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #1e7e34;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        .welcome {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cards { display: flex; gap: 20px; flex-wrap: wrap; }
        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 250px;
            text-align: center;
        }
        .card .icon { font-size: 50px; margin-bottom: 15px; }
        .card h3 { color: #28a745; margin-bottom: 10px; }
        .card a {
            display: block;
            margin-top: 15px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🏥 MediBook - Espace Médecin</h1>
    <a th:href="@{/}">Se déconnecter</a>
</div>
<div class="container">
    <div class="welcome">
        <h2>Bienvenue Docteur 👨‍⚕️</h2>
        <p>Gérez vos rendez-vous et votre agenda</p>
    </div>
    <div class="cards">
        <div class="card">
            <div class="icon">📅</div>
            <h3>Mes Rendez-vous</h3>
            <p>Consultez vos rendez-vous du jour</p>
            <a th:href="@{/medecin/rdv/1}">Voir mes RDV</a>
        </div>
        <div class="card">
            <div class="icon">👥</div>
            <h3>Mes Patients</h3>
            <p>Liste de vos patients</p>
            <a th:href="@{/medecin/dashboard}">Voir patients</a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #dc3545;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .navbar h1 { font-size: 24px; }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #c82333;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            flex: 1;
        }
        .stat-card h2 { font-size: 48px; color: #dc3545; }
        .stat-card p { color: #666; margin-top: 5px; }
        .cards { display: flex; gap: 20px; flex-wrap: wrap; }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 220px;
            text-align: center;
        }
        .card .icon { font-size: 40px; margin-bottom: 10px; }
        .card h3 { color: #dc3545; margin-bottom: 10px; }
        .card a {
            display: block;
            margin-top: 15px;
            padding: 10px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🏥 MediBook - Administration</h1>
    <!-- ✅ CORRECT - formulaire POST -->
    <a th:href="@{/authPatient/login}">Se déconnecter</a>
</div>
<div class="container">
    <h2 style="margin-bottom:20px">Tableau de bord</h2>
    <div class="stats">
        <div class="stat-card">
            <h2 th:text="${totalMedecins}">0</h2>
            <p>Médecins</p>
        </div>
        <div class="stat-card">
            <h2 th:text="${totalPatients}">0</h2>
            <p>Patients</p>
        </div>
        <div class="stat-card">
            <h2 th:text="${totalRdv}">0</h2>
            <p>Rendez-vous</p>
        </div>
    </div>
    <div class="cards">
        <div class="card">
            <div class="icon">👨‍⚕️</div>
            <h3>Médecins</h3>
            <a th:href="@{/admin/medecins}">Gérer</a>
        </div>
        <div class="card">
            <div class="icon">👥</div>
            <h3>Patients</h3>
            <a th:href="@{/admin/patients}">Gérer</a>
        </div>
        <div class="card">
            <div class="icon">📅</div>
            <h3>Rendez-vous</h3>
            <a th:href="@{/admin/rdv}">Gérer</a>
        </div>
        <div class="card">
            <div class="icon">🏥</div>
            <h3>Spécialités</h3>
            <a th:href="@{/admin/specialites}">Gérer</a>
        </div>
    </div>
</div>
</body>
</html>

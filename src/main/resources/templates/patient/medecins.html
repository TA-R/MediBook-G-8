<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chercher un médecin - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #2c7be5;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #1a68d1;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        select, input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .medecins-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .medecin-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 250px;
            text-align: center;
        }
        .medecin-card .icon { font-size: 50px; margin-bottom: 10px; }
        .medecin-card h3 { color: #2c7be5; }
        .medecin-card p { color: #666; margin: 5px 0; }
        .btn-rdv {
            display: block;
            margin-top: 15px;
            padding: 10px;
            background-color: #2c7be5;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🔍 Chercher un médecin</h1>
    <a th:href="@{/dashboardPatient/}">Retour</a>
</div>
<div class="container">

    <!-- Filtre par spécialité -->
    <div class="search-bar">
        <form th:action="@{/dashboardPatient/medecins}" method="get">
            <select name="specialiteId">
                <option value="">Toutes les spécialités</option>
                <option th:each="s : ${specialites}"
                        th:value="${s.id}"
                        th:text="${s.nom}"></option>
            </select>
            <button type="submit" class="btn">🔍 Filtrer</button>
        </form>
    </div>

    <!-- Liste des médecins -->
    <div class="medecins-grid">
        <div th:each="m : ${medecins}" class="medecin-card">
            <div class="icon">👨‍⚕️</div>
            <h3 th:text="${'Dr. ' + m.nom + ' ' + m.prenom}"></h3>
            <p th:text="${m.specialite != null ? m.specialite.nom : 'Généraliste'}"></p>
            <a th:href="@{/dashboardPatient/rdv/{id}(id=${m.id})}"
               class="btn-rdv">📅 Prendre RDV</a>
        </div>
    </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes RDV - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #2c7be5;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #1a68d1;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        table {
            width: 100%;
            background: white;
            border-radius: 10px;
            border-collapse: collapse;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th {
            background-color: #2c7be5;
            color: white;
            padding: 15px;
            text-align: left;
        }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        .annule { color: black; font-weight: bold; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📅 Mes Rendez-vous</h1>
    <a th:href="@{/dashboardPatient/}">Retour</a>
</div>
<div class="container">
    <h2 style="margin-bottom:20px">Liste de mes rendez-vous</h2>
    <table>
        <thead>
        <tr>
            <th>Médecin</th>
            <th>Date</th>
            <th>Heure</th>
            <th>Statut</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rdv : ${rdvs}">
            <td th:text="${'Dr. ' + rdv.medecin.nom + ' ' + rdv.medecin.prenom}"></td>
            <td th:text="${rdv.date}"></td>
            <td th:text="${rdv.heure}"></td>
            <td>
                        <span th:text="${rdv.statut}"
                              th:class="${rdv.statut == 'EN_ATTENTE' ? 'en-attente' :
                                        rdv.statut == 'CONFIRME' ? 'confirme' :
                                        'annule'}"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(rdvs)}">
            <td colspan="4" style="text-align:center; padding:20px">
                Aucun rendez-vous pour le moment
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prendre RDV - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #2c7be5;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #1a68d1;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .medecin-info {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f0f2f5;
            border-radius: 8px;
        }
        .medecin-info .icon { font-size: 50px; }
        .medecin-info h3 { color: #2c7be5; margin-top: 10px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .error { color: red; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📅 Prendre un RDV</h1>
    <a th:href="@{/dashboardPatient/medecins}">Retour</a>
</div>
<div class="container">
    <div class="form-card">

        <!-- Info médecin -->
        <div class="medecin-info">
            <div class="icon">👨‍⚕️</div>
            <h3 th:text="${'Dr. ' + medecin.nom + ' ' + medecin.prenom}"></h3>
            <p th:text="${medecin.specialite != null ? medecin.specialite.nom : 'Généraliste'}"></p>
        </div>

        <!-- Erreur -->
        <p th:if="${erreur}" th:text="${erreur}" class="error"></p>

        <form th:action="@{/dashboardPatient/rdv/{id}(id=${medecin.id})}" method="post">
            <input type="hidden" name="patientId" value="1"/>
            <label>Date du rendez-vous :</label>
            <input type="date" name="date" required/>
            <label>Heure du rendez-vous :</label>
            <input type="time" name="heure" required/>
            <button type="submit" class="btn">✅ Confirmer le RDV</button>
        </form>
    </div>
</div>
</body>
</html>

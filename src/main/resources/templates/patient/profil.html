<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon Profil - MediBook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; }
        .navbar {
            background-color: #2c7be5;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #1a68d1;
            border-radius: 5px;
        }
        .container { padding: 30px; }
        .profil-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .profil-card .icon {
            font-size: 80px;
            text-align: center;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .info-row label { color: #666; }
        .info-row span { font-weight: bold; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>👤 Mon Profil</h1>
    <a th:href="@{/dashboardPatient/}">Retour</a>
</div>
<div class="container">
    <div class="profil-card">
        <div class="icon">👤</div>
        <h2 style="text-align:center; margin-bottom:20px">
            Mon profil patient
        </h2>
        <div class="info-row">
            <label>Nom :</label>
            <span th:text="${patient != null ? patient.nom : 'Non défini'}"></span>
        </div>
        <div class="info-row">
            <label>Prénom :</label>
            <span th:text="${patient != null ? patient.prenom : 'Non défini'}"></span>
        </div>
    </div>
</div>
</body>
</html>
